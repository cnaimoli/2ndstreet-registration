<!DOCTYPE html>
<html lang="en"><head><title>2nd Street Gymnastics</title><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2a41;--mute:#5b6b80;--line:#c5d0de;--blue:#2540d9;--sun:#ffc83d;--bg:#f3f7fb}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Outfit,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:720px;margin:32px auto 0;padding:0 18px 70px}
main h1{font-size:2rem;line-height:1.1;font-weight:800;margin:0 0 8px}
.top{position:relative;overflow:hidden;background:linear-gradient(#fff,#eaf3fb);border-bottom:1px solid #dbe4ee;padding:20px 18px}
.top .logo{position:relative;z-index:1}
.deco{position:absolute;bottom:0;height:100%;width:auto;max-width:30%}
.deco.l{left:0}.deco.r{right:0;transform:scaleX(-1)}
@media(max-width:900px){.top{padding-bottom:84px}.deco{height:84px}}
.hero{background:linear-gradient(135deg,#1b3a8a,#2540d9 60%,#5b8def);color:#fff;text-align:center;padding:44px 20px 44px}
.hero h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;font-weight:800;margin:0 auto 12px;max-width:20ch}
.hero p{margin:0 auto;max-width:52ch;opacity:.93}
footer{text-align:center;color:var(--mute);padding:28px 18px;border-top:1px solid #dbe4ee;font-size:.9rem}
.logo{display:block;width:min(100%,460px);height:auto;margin:0 auto}
.sub{color:var(--mute);margin:0 0 28px;max-width:52ch}
fieldset,.kid{background:#fff;border:1px solid #dbe4ee;border-radius:16px;padding:22px;margin:0 0 18px;box-shadow:0 8px 28px rgba(27,42,65,.09)}
legend{float:left;width:100%;padding:0;margin:0 0 14px;font-weight:800;font-size:1.15rem}
legend+*{clear:both}
h3{margin:0 0 10px;font-size:1.1rem}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-weight:600;font-size:.9rem}
input{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:8px;margin-top:4px}
input[type=radio]{width:auto;margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.lv{font-weight:800;margin:16px 0 0}
.opt{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;font-weight:400;font-size:1rem}
.opt:has(input:checked){border-color:var(--blue);background:#eaf0ff}
.opt.dis{opacity:.55;cursor:not-allowed}
.tag{margin-left:auto;font-size:.8rem;font-weight:600;background:var(--sun);padding:2px 10px;border-radius:99px;white-space:nowrap}
.btn{font:inherit;font-size:1.05rem;font-weight:800;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
.btn.alt{background:none;color:var(--blue);border:2px solid var(--blue)}
.btn:disabled{opacity:.5}
.x{float:right;background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;text-decoration:underline}
.note{background:#fff7de;border-left:5px solid var(--sun);padding:10px 14px;border-radius:6px;margin-top:12px}
.err{color:#b3261e;font-weight:600;margin:12px 0}
.res{background:#fff;border:1px solid #dbe4ee;box-shadow:0 8px 28px rgba(27,42,65,.09);border-radius:16px;padding:18px;margin-bottom:12px}
.hide{display:none}
#go{width:100%;padding:15px}
#soon .note{margin:0 0 18px;font-size:1.05rem}
</style></head>

<div id="err" class="err" role="alert"></div>
<button class="btn" id="go" type="button" onclick="send()">Register</button>
</div>
<div id="result" class="hide"></div>
</main>
<footer>2nd Street Gymnastics. Questions? Send us a DM on Instagram.</footer>

<script>
// ===== Paste the Google web app link (ends in /exec) between the quotes =====
const API_URL = 'https://script.google.com/macros/s/AKfycbxGEdgJ3fUUiKEWAtT6KUWxYy5v2NVqTSL2mKxIfLiDB9J8m3Yx6WbBbEu5lUrFPMRr/exec';
function api(action, payload) {  // talks to the Google Sheet behind the scenes
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, payload)) }).then(r => r.json());
}
const NET_ERR = 'Could not reach registration. Please check your connection and try again.';
let kids = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ord = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const list = a => a.length < 3 ? a.join(' and ') : a.slice(0, -1).join(', ') + ', and ' + a[a.length - 1];
const today = new Date().toISOString().slice(0, 10);

function addKid() { kids.push({first:'', last:'', birth:'', classId:'', backupId:'', info:null, notice:''}); draw(); }
const needsBackup = k => !!(k.info && k.info.classes && k.info.classes.some(c => c.id === k.classId && c.needsApproval));

function classHtml(k, i) {
  if (!k.birth) return '';
  if (!k.info) return '<p class="sub">Checking classes...</p>';
  if (k.info.closed) return '<div class="note">Registration is closed.</div>';
  const cl = k.info.classes;
  if (!cl.length) return '<div class="note">No class fits this birthdate this season. Please DM us on Instagram.</div>';
  if (!cl.some(c => c.open)) {  // none of this child's classes are open yet: tell them when to come back
    const lv = cl.map(c => c.level).filter((v, j, a) => a.indexOf(v) === j);
    return '<div class="note"><b>' + list(lv) + ' registration is not open yet.</b> Please come back ' + cl[0].opens.replace(', ', ' at ') + '.</div>';
  }
  let h = (k.info.testMode ? '<div class="note"><b>TEST MODE:</b> open times are being ignored.</div>' : '') + (k.notice ? '<div class="note">' + esc(k.notice) + '</div>' : ''), last = '';
  cl.filter(c => c.open).forEach(c => {  // only show classes that are open; locked ones get a 'come back' line below
    if (c.level !== last) { h += '<p class="lv">' + c.level + '</p>'; last = c.level; }
    const tag = !c.open ? 'Opens ' + c.opens : c.needsApproval ? 'Request: needs coach approval' : c.full ? 'Full: you\'d be #' + c.nextWait + ' on the waitlist' : '';
    h += '<label class="opt' + (c.open ? '' : ' dis') + '"><input type="radio" name="c' + i + '" value="' + c.id + '"' +
      (k.classId === c.id ? ' checked' : '') + (c.open ? '' : ' disabled') + '> ' + c.day + 's, ' + c.time +
      (tag ? '<span class="tag">' + tag + '</span>' : '') + '</label>';
  });
  const later = cl.filter(c => !c.open);
  if (later.length) h += '<div class="note">' + list(later.map(c => c.level).filter((v, j, a) => a.indexOf(v) === j)) +
    ' registration opens ' + later[0].opens.replace(', ', ' at ') + '. Please come back then for those classes.</div>';
  if (needsBackup(k)) {
    h += '<div class="note"><b>Intermediate needs coach approval.</b> Please also pick a backup Beginner II day. Your child keeps that spot unless Intermediate is approved.</div>' +
      '<p class="lv">Backup: Beginner II</p>';
    cl.filter(c => c.id.indexOf('B2-') === 0).forEach(c => {
      const tag = !c.open ? 'Opens ' + c.opens : c.full ? 'Full: you\'d be #' + c.nextWait + ' on the waitlist' : '';
      h += '<label class="opt' + (c.open ? '' : ' dis') + '"><input type="radio" name="b' + i + '" value="' + c.id + '"' +
        (k.backupId === c.id ? ' checked' : '') + (c.open ? '' : ' disabled') + '> ' + c.day + 's, ' + c.time +
        (tag ? '<span class="tag">' + tag + '</span>' : '') + '</label>';
    });
  }
  return h;
}

function drawCls(d, k, i) {
  const el = d.querySelector('.cls'); el.innerHTML = classHtml(k, i);
  el.querySelectorAll('input[name=c' + i + ']').forEach(r => r.onchange = () => { k.classId = r.value; if (!needsBackup(k)) k.backupId = ''; drawCls(d, k, i); });
  el.querySelectorAll('input[name=b' + i + ']').forEach(r => r.onchange = () => { k.backupId = r.value; });
}

function redrawKid(k) {  // draw a child's classes into the box that's on screen now (the page may have redrawn meanwhile)
  const i = kids.indexOf(k), d = $('kids').children[i];
  if (d) drawCls(d, k, i);
}
function draw() {
  const box = $('kids'); box.innerHTML = '';
  kids.forEach((k, i) => {
    const d = document.createElement('div'); d.className = 'kid';
    d.innerHTML = (i ? '<button type="button" class="x">Remove</button>' : '') + '<h3>Child</h3>' +
      '<div class="row"><label>First name<input data-f="first" value="' + esc(k.first) + '"></label>' +
      '<label>Last name<input data-f="last" value="' + esc(k.last) + '"></label>' +
      '<label>Birthdate<input data-f="birth" type="date" max="' + today + '" value="' + k.birth + '"></label></div>' +
      '<div class="cls">' + classHtml(k, i) + '</div>';
    d.querySelectorAll('input[data-f]').forEach(inp => {
      inp.oninput = () => { k[inp.dataset.f] = inp.value; };
      if (inp.dataset.f !== 'birth') inp.onchange = refreshAll;
    });
    d.querySelector('input[data-f=birth]').onchange = e => {
      const v = e.target.value, y = +v.slice(0, 4);
      k.classId = ''; k.backupId = ''; k.notice = ''; k.info = null; $('err').textContent = '';
      if (!v || y < 2010 || v > today) { k.birth = ''; drawCls(d, k, i); return; }  // ignore half-typed years
      k.birth = v; drawCls(d, k, i);
      api('getClasses', { birth: v, first: k.first, last: k.last, parent: $('parent').value })
        .then(r => { if (k.birth === v) { k.info = r; redrawKid(k); } })
        .catch(() => { $('err').textContent = NET_ERR; });
    };
    drawCls(d, k, i);
    const rm = d.querySelector('.x'); if (rm) rm.onclick = () => { kids.splice(i, 1); draw(); };
    box.appendChild(d);
  });
}

// Child / parent names decide whether a 7-year-old is a returning Intermediate kid, so re-check when they change.
const flags = k => k.info && k.info.classes ? k.info.classes.map(c => c.id + (c.needsApproval ? '*' : '') + (c.open ? '' : '-')).join(',') : '';
function refreshAll() {
  kids.forEach(k => {
    if (!k.birth) return;
    const v = k.birth;
    api('getClasses', { birth: v, first: k.first, last: k.last, parent: $('parent').value }).then(r => {
      if (k.birth !== v) return;
      const before = flags(k);
      k.info = r;
      if (flags(k) === before) return;  // nothing changed: don't redraw while they're typing
      if (r.classes && !r.classes.some(c => c.id === k.classId && c.open)) k.classId = '';
      if (!needsBackup(k)) k.backupId = '';
      draw();
    }).catch(() => {});
  });
}

function fetchInfo(k) {  // re-load one child's classes from Google
  if (!k.birth) return Promise.resolve();
  return api('getClasses', { birth: k.birth, first: k.first, last: k.last, parent: $('parent').value })
    .then(r => { if (r && r.classes) k.info = r; }).catch(() => {});
}
// A child whose classes aren't open yet is left out of this registration; the parent is told when to come back for them.
const lockedOut = k => !!(k.info && k.info.classes && k.info.classes.length && !k.info.classes.some(c => c.open));
const uniqLevels = k => k.info.classes.map(c => c.level).filter((v, j, a) => a.indexOf(v) === j);
async function send() {
  $('err').textContent = '';
  if (kids.some(lockedOut)) {  // their classes may have opened since the page last checked: ask again before deciding
    $('go').disabled = true;
    const stale = kids.filter(lockedOut);
    await Promise.all(stale.map(fetchInfo));
    $('go').disabled = false;
    const opened = stale.filter(k => !lockedOut(k));
    if (opened.length) {
      draw(); loadStatus();
      $('err').textContent = 'Classes just opened for ' + list(opened.map(k => k.first || 'your child')) + '. Please pick a class, then press Register again.';
      return;
    }
  }
  const later = kids.filter(lockedOut), ready = kids.filter(k => !lockedOut(k));
  if (!ready.length) { $('err').textContent = 'These classes are not open yet. Please come back at the time shown under each child.'; return; }
  $('go').disabled = true;
  api('submit', { data: {parent: $('parent').value, email: $('email').value, ig: $('ig').value, phone: $('phone').value, children: ready.map(k => ({first:k.first, last:k.last, birth:k.birth, classId:k.classId, backupId:k.backupId}))} }).then(r => {
    $('go').disabled = false;
    if (r.error) $('err').textContent = r.error;
    else show(r.results, later);
  }).catch(() => { $('go').disabled = false; $('err').textContent = 'Something went wrong. Please check your connection and try again.'; });
}

function show(res, later) {
  let h = '<h1>Thank you!</h1><p class="sub">Here is what happened for each class.</p>';
  res.forEach(r => {
    if (r.status === 'Registered') h += '<div class="res"><b>' + esc(r.name) + ' is registered</b> for ' + esc(r.cls) + '.' +
      (r.backup ? '<br>This is the backup day while Intermediate is reviewed.' : '') + '</div>';
    else if (r.status === 'Pending approval') h += '<div class="res"><b>' + esc(r.name) + ' has requested</b> ' + esc(r.cls) + '.' +
      '<br>Intermediate for 7-year-olds needs coach approval, so this is not a confirmed spot yet. We will contact you once it is reviewed. Until then, your backup Beginner II day stands.</div>';
    else if (r.status === 'Already registered') h += '<div class="res"><b>' + esc(r.name) + ' is already registered.</b> Nothing was changed for ' +
      esc(r.name) + '. To switch classes, please DM us on Instagram.</div>';
    else h += '<div class="res"><b>' + esc(r.name) + ' is #' + r.pos + ' on the waitlist</b> for ' + esc(r.cls) + ' (the class is full).' +
      '<br>This is your current spot, not a guaranteed place. We will contact you if a spot opens.</div>';
  });
  (later || []).forEach(k => {
    h += '<div class="res"><b>' + esc(k.first || 'Your child') + ' is not registered yet.</b> ' + list(uniqLevels(k)) + ' registration opens ' +
      k.info.classes[0].opens.replace(', ', ' at ') + '. Please come back then to register ' + esc(k.first || 'them') + '.</div>';
  });
  done = true; if (soonTimer) { clearInterval(soonTimer); soonTimer = null; } $('soon').innerHTML = '';
  $('formBox').classList.add('hide'); $('result').innerHTML = h; $('result').classList.remove('hide'); scrollTo(0, 0);
}

// 'Come back at...' banner while some levels haven't opened. Re-checks every 15 seconds and unlocks classes when they open.
let lastSoon = null, soonTimer = null, done = false;
function showStatus(r) {
  if (done) return;  // already registered: leave the thank-you screen alone
  let h = '';
  if (r.closed) h = '<div class="note"><b>Registration is closed.</b></div>';
  else if (r.upcoming && r.upcoming.length) {
    const same = r.upcoming.every(u => u.day === r.upcoming[0].day);
    const parts = r.upcoming.map(u => (same ? '' : u.day + ' at ') + u.time + ' for ' + list(u.names));
    h = r.openNow && r.openNow.length
      ? '<div class="note"><b>' + list(r.openNow) + ' registration is open now.</b> ' +
        r.upcoming.map(u => list(u.names) + ' registration opens ' + u.day + ' at ' + u.time).join('. ') + '.</div>'
      : '<div class="note"><b>Registration is not open yet.</b> Please come back ' + (same ? r.upcoming[0].day + ' at ' : '') + parts.join(', and ') + '.</div>';
  }
  $('soon').innerHTML = h;
  const key = JSON.stringify(r.upcoming || []);
  if (lastSoon !== null && key !== lastSoon) refreshAll();
  lastSoon = key;
  $('formBox').classList.toggle('hide', !!r.closed || r.anyOpen === false);  // no typing until something is open
  if (!r.closed && !(r.upcoming && r.upcoming.length) && soonTimer) { clearInterval(soonTimer); soonTimer = null; }
}
function loadStatus() { api('status', {}).then(showStatus).catch(() => $('formBox').classList.remove('hide')); }  // if the check fails, show the form anyway (the server still enforces times)
addKid();
loadStatus(); soonTimer = setInterval(loadStatus, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !done) loadStatus(); });  // re-check right away when they come back to the page
$('parent').onchange = refreshAll;
$('phone').oninput = e => {  // auto-format as 555-555-5555, digits only, max 10
  let d = e.target.value.replace(/\D/g, '');
  if (d.length === 11 && d[0] === '1') d = d.slice(1);
  d = d.slice(0, 10);
  e.target.value = d.length > 6 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d;
};
</script></body></html>
